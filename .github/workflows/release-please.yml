name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  queue: max

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          target-branch: ${{ github.ref_name }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  verify:
    needs: release-please
    if: >-
      ${{
        !cancelled() &&
        (github.event_name == 'workflow_dispatch' ||
        (needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true'))
      }}
    permissions:
      contents: read
    uses: ./.github/workflows/verify-release.yml
    with:
      release-tag: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || needs.release-please.outputs.tag_name }}

  publish:
    needs: verify
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
      - uses: actions/download-artifact@v8
        with:
          name: release-package
          path: ${{ runner.temp }}/release-package
      - run: npm i -g npm@latest
      - run: npm publish "$RUNNER_TEMP/release-package/package.tgz" --ignore-scripts --provenance --registry=https://registry.npmjs.org/
