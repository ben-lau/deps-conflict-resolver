name: Verify Release

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Require a published GitHub Release for manual publishing
        if: github.event_name == 'workflow_dispatch' && inputs.release-tag
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]; then
            echo "::error::Run Release on an existing release tag. To inspect a branch without publishing, run Verify Release."
            exit 1
          fi
          is_draft=$(gh release view --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft -- "$RELEASE_TAG")
          if [ "$is_draft" != 'false' ]; then
            echo "::error::The GitHub Release for $RELEASE_TAG is still a draft."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-tag && format('refs/tags/{0}', inputs.release-tag) || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - name: Check the release commit and version
        if: github.event_name == 'push' || inputs.release-tag
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::The release tag $RELEASE_TAG points to a different commit. Run Release again on that tag."
            exit 1
          fi
          expected_tag="v$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "::error::Expected release tag $expected_tag, got $RELEASE_TAG."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm fmt:check
      - run: pnpm typecheck
      - name: Pack the candidate
        run: |
          mkdir -p "$RUNNER_TEMP/release-package"
          pnpm pack --out "$RUNNER_TEMP/release-package/package.tgz"
      - name: Check the packed candidate
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          archive="$RUNNER_TEMP/release-package/package.tgz"
          pnpm exec publint run "$archive"
          pnpm exec attw "$archive" --entrypoints . ./vite ./webpack
          if [ -n "$RELEASE_TAG" ]; then
            package_version=$(tar -xOf "$archive" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
            test "v$package_version" = "$RELEASE_TAG"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: ${{ runner.temp }}/release-package/package.tgz
          if-no-files-found: error
          overwrite: true

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:run

  webpack-consumer:
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 22]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/download-artifact@v8
        with:
          name: release-package
          path: ${{ runner.temp }}/release-package
      - name: Install the packed package and Webpack
        run: >-
          npm install --prefix "$RUNNER_TEMP/release-webpack"
          --ignore-scripts --no-audit --no-fund --package-lock=false --save-exact
          "$RUNNER_TEMP/release-package/package.tgz" webpack@5
      - name: Verify Webpack watch with the packaged plugin
        run: node tests/compat/webpack-release.mjs "$RUNNER_TEMP/release-webpack"

  consumer:
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node-version: 18, vite-version: '4.0.0' }
          - { node-version: 22, vite-version: '4.0.0' }
          - { node-version: 22, vite-version: '5' }
          - { node-version: 22, vite-version: '6' }
          - { node-version: 22, vite-version: '7' }
          - { node-version: 22, vite-version: '8' }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/download-artifact@v8
        with:
          name: release-package
          path: ${{ runner.temp }}/release-package
      - name: Install the packed package and Vite
        run: >-
          npm install --prefix "$RUNNER_TEMP/release-consumer"
          --ignore-scripts --no-audit --no-fund --package-lock=false --save-exact
          "$RUNNER_TEMP/release-package/package.tgz" "vite@${{ matrix.vite-version }}"
      - name: Load all public entry points as ESM and CommonJS
        working-directory: ${{ runner.temp }}/release-consumer
        run: |
          node --input-type=module -e "for (const name of ['deps-conflict-resolver', 'deps-conflict-resolver/vite', 'deps-conflict-resolver/webpack']) await import(name)"
          node -e "for (const name of ['deps-conflict-resolver', 'deps-conflict-resolver/vite', 'deps-conflict-resolver/webpack']) require(name)"
      - name: Verify the packaged CLI
        working-directory: ${{ runner.temp }}/release-consumer
        run: |
          test -x node_modules/.bin/deps-conflict-resolver
          mkdir -p "$RUNNER_TEMP/release-cli-fixture"
          printf '%s\n' '{"name":"release-cli-fixture","version":"1.0.0"}' > "$RUNNER_TEMP/release-cli-fixture/package.json"
          node_modules/.bin/deps-conflict-resolver doctor --root "$RUNNER_TEMP/release-cli-fixture" --offline --strict --json > "$RUNNER_TEMP/release-cli-report.json"
          node -e 'const r = require(process.argv[1]); if (r.schemaVersion !== 1 || r.command !== "doctor" || !Array.isArray(r.diagnostics)) process.exit(1)' "$RUNNER_TEMP/release-cli-report.json"
      - name: Build a consumer with conflicting Vue versions
        run: node tests/compat/vite-release.mjs "$RUNNER_TEMP/release-consumer"
      - name: Verify optimizer and SSR compatibility when available
        if: ${{ matrix.node-version == 22 }}
        run: |
          if [ -f tests/compat/vite.mjs ]; then
            npm install --prefix "$RUNNER_TEMP/release-consumer" --ignore-scripts --no-audit --no-fund --package-lock=false --save-exact "vite@${{ matrix.vite-version }}" vue@3.5.18 vue2@npm:vue@2.7.16
            ln -s "$RUNNER_TEMP/release-consumer/node_modules" node_modules
            mkdir -p "$RUNNER_TEMP/unpacked-release"
            tar -xzf "$RUNNER_TEMP/release-package/package.tgz" -C "$RUNNER_TEMP/unpacked-release"
            cp -R "$RUNNER_TEMP/unpacked-release/package/dist" dist
            node tests/compat/vite.mjs "$RUNNER_TEMP/release-consumer"
          fi
